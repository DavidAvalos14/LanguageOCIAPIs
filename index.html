<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCI AI Language App</title>
    <style>
        :root { --primary: #3b82f6; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); padding: 2rem; max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary); }
        .card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; resize: vertical; font-size: 1rem; margin-bottom: 1rem; box-sizing: border-box; }
        .button-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 1rem; }
        button { background-color: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #2563eb; }
        .traduccion-group { display: flex; gap: 10px; align-items: center; background: #e0f2fe; padding: 10px; border-radius: 5px; }
        select { padding: 8px; border-radius: 5px; border: 1px solid #cbd5e1; }
        pre { background: #1e293b; color: #a5b4fc; padding: 15px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; }
        .loader { display: none; font-style: italic; color: #64748b; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>Analizador de Textos OCI</h1>

    <div class="card">
        <textarea id="textoEntrada" placeholder="Escribe o pega el texto que deseas analizar o traducir aquí..."></textarea>
        
        <div class="button-group">
            <button onclick="llamarAPI('sentimientos')">🎭 Analizar Sentimientos</button>
            <button onclick="llamarAPI('idioma')">🌐 Detectar Idioma</button>
            <button onclick="llamarAPI('entidades')">🏷️ Extraer Entidades</button>
            <button onclick="llamarAPI('frases-clave')">🔑 Frases Clave</button>
        </div>

        <div class="traduccion-group">
            <label for="idiomaDestino">Traducir a:</label>
            <select id="idiomaDestino">
                <option value="en">Inglés</option>
                <option value="es">Español</option> <option value="fr">Francés</option>
                <option value="pt">Portugués</option>
                <option value="de">Alemán</option>
                <option value="it">Italiano</option>
            </select>
            <button onclick="llamarTraduccion()" style="background-color: #0284c7;">A/字 Traducir</button>
        </div>
    </div>

    <div class="card">
        <h3>Resultado de la API:</h3>
        <div id="cargando" class="loader">Procesando petición en Oracle Cloud...</div>
        <pre id="resultado">Esperando acción...</pre>
    </div>

    <script>
        const baseUrl = 'http://localhost:3000/api';

        // Función genérica para los 4 endpoints simples
        async function llamarAPI(endpoint) {
            const texto = document.getElementById('textoEntrada').value;
            if (!texto) return alert('Por favor, escribe un texto primero.');

            mostrarCarga(true);
            try {
                const response = await fetch(`${baseUrl}/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto: texto })
                });
                
                const data = await response.json();
                mostrarResultado(data);
            } catch (error) {
                mostrarResultado({ error: `No se pudo conectar con el backend en el endpoint /${endpoint}` });
            }
            mostrarCarga(false);
        }

        // Función específica para traducción porque requiere el idioma destino
        async function llamarTraduccion() {
            const texto = document.getElementById('textoEntrada').value;
            const idioma = document.getElementById('idiomaDestino').value;
            
            if (!texto) return alert('Por favor, escribe un texto primero.');

            mostrarCarga(true);
            try {
                const response = await fetch(`${baseUrl}/traduccion`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto: texto, idiomaDestino: idioma })
                });
                
                const data = await response.json();
                mostrarResultado(data);
            } catch (error) {
                mostrarResultado({ error: 'No se pudo conectar con el backend para la traducción' });
            }
            mostrarCarga(false);
        }

        // Utilidades para la UI
        function mostrarCarga(estado) {
            document.getElementById('cargando').style.display = estado ? 'block' : 'none';
            document.getElementById('resultado').style.opacity = estado ? '0.5' : '1';
        }

        function mostrarResultado(data) {
            const contenedor = document.getElementById('resultado');
            
            // 1. Manejo de Errores globales del backend
            if (data.error) {
                contenedor.innerHTML = `
                    <div style="background: #0f172a; padding: 15px; border-radius: 5px; border-left: 4px solid #ef4444; color: #f8fafc;">
                        <strong>❌ Error:</strong> ${data.error}
                    </div>`;
                return;
            }

            // 2. Formato para: Análisis de Sentimientos
            if (data.aspects) {
                let html = '<div style="font-family: sans-serif;">';
                html += '<h4 style="color: #cbd5e1; margin-bottom: 10px;">🎭 Desglose de Sentimientos:</h4>';
                html += '<ul style="list-style: none; padding: 0; margin: 0;">';
                
                data.aspects.forEach(aspecto => {
                    let color = '#94a3b8'; 
                    if (aspecto.sentiment === 'Positive') color = '#22c55e'; 
                    if (aspecto.sentiment === 'Negative') color = '#ef4444'; 
                    
                    let porcentaje = (aspecto.scores[aspecto.sentiment] * 100).toFixed(1);

                    html += `<li style="background: #0f172a; margin-bottom: 8px; padding: 10px; border-radius: 5px; border-left: 4px solid ${color}; color: #cbd5e1;">
                                Elemento: <strong style="color: white;">"${aspecto.text}"</strong> <br>
                                Sentimiento: <span style="color: ${color}; font-weight: bold;">${aspecto.sentiment}</span> 
                                <span style="color: #64748b; font-size: 0.9em;">(Confianza: ${porcentaje}%)</span>
                            </li>`;
                });
                html += '</ul></div>';
                contenedor.innerHTML = html;
            } 
            // 3. Formato para: Traducción
            else if (data.documents && data.documents[0].translatedText) {
                const doc = data.documents[0];
                let html = '<div style="font-family: sans-serif;">';
                html += '<h4 style="color: #cbd5e1; margin-bottom: 10px;">A/字 Texto Traducido:</h4>';
                html += `<div style="background: #0f172a; padding: 15px; border-radius: 5px; border-left: 4px solid #0ea5e9; font-size: 1.1em; color: #f8fafc;">
                            ${doc.translatedText}
                        </div>`;
                html += `<p style="color: #64748b; font-size: 0.8em; margin-top: 10px;">
                            Traducido de <strong>${doc.sourceLanguageCode.toUpperCase()}</strong> a <strong>${doc.targetLanguageCode.toUpperCase()}</strong>
                        </p>`;
                html += '</div>';
                contenedor.innerHTML = html;
            }
            // 4. Formato para: Detectar Idioma Dominante
            else if (data.languages) {
                let html = '<div style="font-family: sans-serif;">';
                html += '<h4 style="color: #cbd5e1; margin-bottom: 10px;">🌐 Idioma Detectado:</h4>';
                
                data.languages.forEach(lang => {
                    let porcentaje = (lang.score * 100).toFixed(1);
                    html += `<div style="background: #0f172a; padding: 15px; border-radius: 5px; border-left: 4px solid #a855f7; color: #f8fafc;">
                                Idioma principal: <strong style="color: #c084fc; font-size: 1.1em;">${lang.name} (${lang.code})</strong><br>
                                <span style="color: #64748b; font-size: 0.9em;">Certeza de detección: ${porcentaje}%</span>
                            </div>`;
                });
                html += '</div>';
                contenedor.innerHTML = html;
            }
            // 5. Formato para: Extraer Entidades
            else if (data.entities) {
                let html = '<div style="font-family: sans-serif;">';
                html += '<h4 style="color: #cbd5e1; margin-bottom: 10px;">🏷️ Entidades Extraídas:</h4>';
                
                if (data.entities.length === 0) {
                    html += '<p style="color: #64748b; font-style: italic;">No se identificaron entidades (lugares, fechas, nombres) en el texto.</p>';
                } else {
                    html += '<ul style="list-style: none; padding: 0; margin: 0;">';
                    data.entities.forEach(entidad => {
                        let porcentaje = (entidad.score * 100).toFixed(1);
                        html += `<li style="background: #0f172a; margin-bottom: 8px; padding: 10px; border-radius: 5px; border-left: 4px solid #f59e0b; color: #cbd5e1;">
                                    Valor: <strong style="color: white;">"${entidad.text}"</strong><br>
                                    Tipo de Entidad: <span style="color: #fbbf24; font-weight: bold;">${entidad.type}</span> 
                                    <span style="color: #64748b; font-size: 0.9em;">(Certeza: ${porcentaje}%)</span>
                                </li>`;
                    });
                    html += '</ul>';
                }
                html += '</div>';
                contenedor.innerHTML = html;
            }
            // 6. Formato para: Frases Clave (Se verán como "etiquetas" modernas)
            else if (data.keyPhrases) {
                let html = '<div style="font-family: sans-serif;">';
                html += '<h4 style="color: #cbd5e1; margin-bottom: 10px;">🔑 Frases e Ideas Clave:</h4>';
                html += '<div style="display: flex; flex-wrap: wrap; gap: 8px;">';
                
                data.keyPhrases.forEach(frase => {
                    html += `<span style="background: #0f172a; color: #38bdf8; padding: 8px 14px; border-radius: 20px; border: 1px solid #0284c7; font-weight: 500; font-size: 0.95em;">
                                ${frase.text}
                            </span>`;
                });
                
                html += '</div></div>';
                contenedor.innerHTML = html;
            }
            // Fallback de seguridad en caso de recibir una estructura inesperada
            else {
                contenedor.innerText = JSON.stringify(data, null, 2);
            }
        }
    </script>
</body>
</html>
